name: "CI"
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image
        run: docker build -t load-dependents-count .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run action with inline repos
        uses: ./
        id: dependents
        with:
          repos: '["devops-actions/action-get-tag"]'
          output-file: test-output.json

      - name: Verify output file exists
        run: |
          if [ ! -f test-output.json ]; then
            echo "::error::Output file not found"
            exit 1
          fi
          echo "Output file contents:"
          cat test-output.json

      - name: Verify action outputs
        run: |
          if [ -z '${{ steps.dependents.outputs.results }}' ]; then
            echo "::error::results output is empty"
            exit 1
          fi
          echo "Results: ${{ steps.dependents.outputs.results }}"
