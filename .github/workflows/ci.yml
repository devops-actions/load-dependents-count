name: "CI"
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t load-dependents-count .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action with inline repos
        uses: ./
        id: dependents
        with:
          repos: '["devops-actions/action-get-tag"]'
          output-file: test-output.json

      - name: Verify output file exists
        run: |
          if [ ! -f test-output.json ]; then
            echo "::error::Output file not found"
            exit 1
          fi
          echo "Output file contents:"
          cat test-output.json

      - name: Verify action outputs
        run: |
          if [ -z '${{ steps.dependents.outputs.results }}' ]; then
            echo "::error::results output is empty"
            exit 1
          fi
          echo "Results: ${{ steps.dependents.outputs.results }}"
