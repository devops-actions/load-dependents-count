name: "CI"
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Docker image
        run: docker build -t load-dependents-count .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with inline repos
        uses: ./
        id: dependents
        with:
          repos: '["devops-actions/action-get-tag"]'
          output-file: test-output.json

      - name: Verify output file exists
        run: |
          if [ ! -f test-output.json ]; then
            echo "::error::Output file not found"
            exit 1
          fi
          echo "Output file contents:"
          cat test-output.json

      - name: Verify action outputs
        run: |
          if [ -z '${{ steps.dependents.outputs.results }}' ]; then
            echo "::error::results output is empty"
            exit 1
          fi
          echo "Results: ${{ steps.dependents.outputs.results }}"
